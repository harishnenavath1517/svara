# Local dev infra: Redpanda (event bus), Temporal (turn workflows), Qdrant (vectors).
# `pnpm infra:up` runs this with --wait, so it returns only once every healthcheck passes.
#
# Postgres here backs Temporal AND holds the svara schema (traces, turns, eval_runs,
# eval_scores). In production that role belongs to Supabase — see docs/ARCHITECTURE.md.

name: svara

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --node-id 0
      - --check=false
      # Advertise a listener that resolves both inside the network and from the host.
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
    ports:
      # Host apps talk to the broker on 19092. REDPANDA_BROKERS in .env must match.
      - "19092:19092"
      - "18082:18082"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Creates the topics from docs/DATA_CONTRACTS.md, then exits. Idempotent.
  # Behind a profile so `up --wait` doesn't count this one-shot job's clean exit
  # as a failed service; `pnpm infra:up` runs it explicitly afterwards.
  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    profiles: ["init"]
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: /bin/sh
    # Create only if absent, so a rerun is a no-op but a genuine failure still exits non-zero.
    command: >
      -c "rpk topic describe svara.traces --brokers redpanda:9092 >/dev/null 2>&1
      || rpk topic create svara.traces svara.turns -p 1 -r 1 --brokers redpanda:9092"
    restart: "no"

  console:
    image: redpandadata/console:v2.7.2
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: svara
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The qdrant image has no curl/wget; use the statically linked healthcheck binary.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  redpanda-data:
  postgres-data:
  qdrant-data:
